fortune:
  market:
    base-url: "http://fortune-market.alpha.com"
  broker:
    base-url: "http://fortune-broker.alpha.com"
  client:
    base-url: "http://fortune-client.alpha.com"
external:
  yahoo-finance:
    base-url: "https://query2.finance.yahoo.com"
    search-path: "/v1/finance/search"
    chart-path: "/v8/finance/chart/{symbol}"
  frankfurter:
    base-url: "https://api.frankfurter.dev"
    history-path: "/v1"
    latest-path: "/v1/latest"
  nominatim:
    base-url: "https://nominatim.openstreetmap.org"
    search-path: "/search"
  user-agent: "Fortune/1.0 (admin@vrevankar.com)"

jasypt:
  encryptor:
    password: "${JASYPT_ENCRYPTOR_PASSWORD}"
    algorithm: "PBEWITHHMACSHA512ANDAES_256"
