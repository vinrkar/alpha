plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot.get()}"
    }
}

dependencies {
    implementation project(':fortune:fortune-commons')

    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.batch
    implementation libs.spring.jdbc
    implementation libs.spring.boot.starter.webflux

    implementation libs.jasypt.spring.boot
    implementation libs.bouncycastle.prov
    implementation libs.jackson.databind
    implementation libs.resilience4j.spring.boot

    // Messaging & Tracing
    implementation libs.spring.kafka
    implementation libs.micrometer.tracing.brave

    // Utilities & Documentation
    implementation libs.commons.text
    implementation libs.springdoc.openapi

    // Database Driver & Core Migrations
    implementation libs.liquibase.core
    implementation libs.ojdbc11
    runtimeOnly libs.ojdbc11

    // Lombok
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // Testing
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.batch.test
    testImplementation libs.spring.kafka.test
}

tasks.named('bootJar') {
    enabled = true
    mainClass = 'com.vrevankar.alpha.fortune.market.FortuneMarketApp'
}

apply from: "kafka-topics.gradle"
if (hasProperty('configureKafkaTopicTask')) {
    configureKafkaTopicTask(file("src/main/resources/kafka/topics.yaml"))
}

tasks.named('bootRun') {
    dependsOn 'createKafkaTopics'
}
