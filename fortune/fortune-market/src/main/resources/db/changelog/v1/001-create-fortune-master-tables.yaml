databaseChangeLog:
  - changeSet:
      id: 001-create-fortune-master-tables
      author: vinay.revankar
      changes:
        - createTable:
            tableName: SECURITY_MASTER
            columns:
              - column:
                  name: SEC_ID
                  type: RAW(16)
                  defaultValueComputed: SYS_GUID()
                  constraints:
                    nullable: false
              - column:
                  name: ISIN
                  type: VARCHAR2(12)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: TICKER
                  type: VARCHAR2(10)
                  constraints:
                    nullable: false
              - column:
                  name: SEC_NM
                  type: VARCHAR2(100)
                  constraints:
                    nullable: false
              - column:
                  name: XCHG
                  type: VARCHAR2(8)
                  constraints:
                    nullable: false
              - column:
                  name: CURR
                  type: VARCHAR2(3)
                  defaultValue: 'INR'
                  constraints:
                    nullable: false
              - column:
                  name: START_DT
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: END_DT
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: ACTIVE
                  type: VARCHAR2(1)
                  defaultValue: 'Y'
                  constraints:
                    nullable: false
                    check: "ACTIVE IN ('Y', 'N')"
              - column:
                  name: STATUS
                  type: VARCHAR2(20)
                  defaultValue: 'PENDING_ENRICHMENT'
                  constraints:
                    nullable: false
                    check: "STATUS IN ('PENDING_ENRICHMENT', 'PROCESSING', 'COMPLETED', 'FAILED')"
              - column:
                  name: CRT_DTTM
                  type: TIMESTAMP(6)
                  defaultValueComputed: SYSTIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: UPDT_DTTM
                  type: TIMESTAMP(6)
                  defaultValueComputed: SYSTIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: RTY_CNT
                  type: NUMBER(2,0)
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: NXT_RTY_DTTM
                  type: TIMESTAMP(6)
                  defaultValueComputed: SYSTIMESTAMP
                  constraints:
                    nullable: true

        - addUniqueConstraint:
            tableName: SECURITY_MASTER
            columnNames: SEC_ID
            constraintName: UK__SECURITY_MASTER__SEC_ID

        - createTable:
            tableName: EXCHANGE_MASTER
            columns:
              - column:
                  name: XCHG_ID
                  type: NUMBER(10)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: FR_CURR
                  type: VARCHAR2(3)
                  constraints:
                    nullable: false
              - column:
                  name: TO_CURR
                  type: VARCHAR2(3)
                  constraints:
                    nullable: false
              - column:
                  name: ACTIVE
                  type: VARCHAR2(1)
                  defaultValue: 'Y'
                  constraints:
                    nullable: false
                    check: "ACTIVE IN ('Y', 'N')"
              - column:
                  name: CRT_DTTM
                  type: TIMESTAMP(6)
                  defaultValueComputed: SYSTIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: UPDT_DTTM
                  type: TIMESTAMP(6)
                  defaultValueComputed: SYSTIMESTAMP
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: EXCHANGE_MASTER
            columnNames: FR_CURR, TO_CURR
            constraintName: UK__EXCHANGE_MASTER__CURR

  - changeSet:
      id: 001-index-fortune-master-tables
      author: vinay.revankar
      changes:
        - createIndex:
            tableName: SECURITY_MASTER
            indexName: IDX__SECURITY_MASTER__TICKER
            columns:
              - column:
                  name: TICKER
        - createIndex:
            tableName: SECURITY_MASTER
            indexName: IDX__SECURITY_MASTER__XCHG
            columns:
              - column:
                  name: XCHG
        - createIndex:
            tableName: SECURITY_MASTER
            indexName: IDX__SECURITY_MASTER__ACTIVE
            columns:
              - column:
                  name: ACTIVE
        - createIndex:
            tableName: SECURITY_MASTER
            indexName: IDX__SECURITY_MASTER__STATUS
            columns:
              - column:
                  name: STATUS
        - createIndex:
            tableName: EXCHANGE_MASTER
            indexName: IDX__EXCHANGE_MASTER__ACTIVE
            columns:
              - column:
                  name: ACTIVE

  - changeSet:
      id: 001-sequence-fortune-master-tables
      author: vinay.revankar
      changes:
        - createSequence:
            sequenceName: SEQ__EXCHANGE_MASTER__XCHG_ID
            startValue: 1
            incrementBy: 1
            cacheSize: 20
