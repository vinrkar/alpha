[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-finnie-ai"
version = "0.1.0"
description = "Rubric-Finnie-AI - Multi-Agent Financial Assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # AI & Agent Framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",

    # RAG & Embeddings
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0.0",

    # Financial Engine & Data
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "yfinance>=0.2.38",

    # API & Async
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",

    # UI & Visualization
    "streamlit>=1.38.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",

    # Protocols & Storage
    "mcp>=1.0.0",
    "langgraph-checkpoint-redis>=0.1.0",
    "redis>=5.0.0",

    # Security & Encryption
    "cryptography>=41.0.0",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",

    # Environment Configuration
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "deepeval>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:deepeval.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true