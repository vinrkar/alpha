services:
  alpha-oracle:
    image: gvenzl/oracle-free:latest
    container_name: alpha-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: "aDminpa$s"

  alpha-cassandra:
    image: cassandra:latest
    container_name: alpha-cassandra
    ports:
      - "9042:9042"

  alpha-kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: alpha-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://alpha-kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@alpha-kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: 'Mk3OEYBSD34-WM0KG1gL7Q'

  alpha-kafbat:
    image: kafbat/kafka-ui:${KAFKA_UI_VERSION}
    container_name: alpha-kafbat
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: alpha
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: alpha-kafka:29092
    depends_on:
      - alpha-kafka

  alpha-ollama:
    image: ollama/ollama:latest
    container_name: alpha-ollama
    ports:
      - "11434:11434"