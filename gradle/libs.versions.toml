[versions]
springBoot = "3.3.3"
jasyptSpring = "3.0.5"
jasyptCore = "1.9.3"
bouncycastle = "1.78"
resilience4j = "2.2.0"
modelmapper = "3.2.6"
lombok = "1.18.32"
ojdbc = "23.3.0.23.09"
jackson = "2.17.1"
kafka = "4.3.1"
springdoc = "2.5.0"
commonsText = "1.11.0"
liquibase = "4.27.0"
libphonenumber = "8.13.35"
micrometerTracing = "1.3.3"

[libraries]
# Spring Boot Starters
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "springBoot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "springBoot" }
spring-boot-starter-batch = { module = "org.springframework.boot:spring-boot-starter-batch", version.ref = "springBoot" }
spring-boot-starter-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase", version.ref = "springBoot" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "springBoot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
spring-boot-starter-batch-test = { module = "org.springframework.boot:spring-boot-starter-batch-test", version.ref = "springBoot" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail", version.ref = "springBoot" }

# Spring Core & Framework
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

# Database & Migrations
ojdbc11 = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "ojdbc" }
liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }

# Security & Encryption
jasypt-spring-boot = { module = "com.github.ulisesbocchio:jasypt-spring-boot-starter", version.ref = "jasyptSpring" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# Observability, Resilience & Utilities
micrometer-tracing-brave = { module = "io.micrometer:micrometer-tracing-bridge-brave", version.ref = "micrometerTracing" }
resilience4j-spring-boot = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
commons-text = { module = "org.apache.commons:commons-text", version.ref = "commonsText" }
libphonenumber = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumber" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Tooling & Testing
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }